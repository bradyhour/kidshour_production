<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kit Clash Costume Ideas</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-rounded, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #eef2ff; background: radial-gradient(circle at 20% 10%, #30265f 0, transparent 35%), radial-gradient(circle at 90% 80%, #123f53 0, transparent 34%), #090d1b; }
      main { width: min(1100px, calc(100% - 32px)); margin: auto; padding: 78px 0 48px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: clamp(27px, 5vw, 48px); letter-spacing: -.04em; }
      .page-nav { position: fixed; z-index: 50; top: 18px; left: 18px; display: flex; gap: 14px; }
      .page-nav a { min-width: 90px; color: #111827; text-align: center; text-decoration: none; background: #fffffff2; border: 2px solid #ffffff55; padding: 9px 14px; border-radius: 10px; box-shadow: 0 8px 22px #0006; }
      .panel { display: grid; grid-template-columns: minmax(310px, .85fr) minmax(320px, 1.15fr); overflow: hidden; border: 1px solid #ffffff24; border-radius: 24px; background: #11172de6; box-shadow: 0 28px 90px #0008; }
      .preview-side { min-height: 590px; display: grid; place-items: center; position: relative; padding: 72px 28px 28px; background: linear-gradient(145deg, #ffffff0d, transparent); }
      .rarity { position: absolute; top: 24px; left: 24px; padding: 7px 12px; border-radius: 999px; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; background: var(--rarity); color: #111827; }
      .stage { width: min(360px, 90%); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0, #ffffff10 48%, transparent 70%); }
      canvas { width: 100%; height: 100%; }
      .details { padding: clamp(25px, 5vw, 52px); display: flex; flex-direction: column; justify-content: center; }
      label { display: grid; gap: 8px; color: #aeb9d8; font-size: 13px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
      select { width: 100%; padding: 13px 15px; border-radius: 12px; color: white; background: #090d1b; border: 1px solid #ffffff29; font: 700 16px inherit; }
      h2 { margin: 32px 0 4px; font-size: clamp(30px, 4vw, 46px); line-height: 1; }
      .tagline { color: var(--accent); font-weight: 800; margin: 8px 0 28px; }
      .idea { padding: 20px; border-radius: 16px; background: #ffffff0a; border-left: 4px solid var(--accent); }
      .idea h3 { margin: 0 0 10px; font-size: 15px; color: #fff; text-transform: uppercase; letter-spacing: .08em; }
      .idea p { margin: 0; color: #cbd5e1; line-height: 1.65; }
      .swatches { display: flex; gap: 9px; margin-top: 25px; }
      .swatch { width: 35px; height: 35px; border: 3px solid #ffffffbf; border-radius: 50%; box-shadow: 0 4px 14px #0006; }
      .note { margin: 22px 0 0; font-size: 13px; color: #8591b1; }
      @media (max-width: 760px) { .panel { grid-template-columns: 1fr; } .preview-side { min-height: 390px; } header { align-items: flex-start; } }
    </style>
  </head>
  <body>
    <nav class="page-nav" aria-label="Page navigation"><a href="index.html" onclick="if (history.length > 1) { event.preventDefault(); history.back(); }">← Back</a><a href="index.html">⌂ Home</a></nav>
    <main>
      <header><div><h1>Costume Idea Viewer</h1></div></header>
      <section class="panel">
        <div class="preview-side"><span id="rarity" class="rarity"></span><div class="stage"><canvas id="preview" width="420" height="420"></canvas></div></div>
        <div class="details">
          <label>Pick a character<select id="character"></select></label>
          <h2 id="name"></h2><p id="tagline" class="tagline"></p>
          <div class="idea"><h3>My costume suggestion</h3><p id="suggestion"></p></div>
          <div id="swatches" class="swatches" aria-label="Suggested colors"></div>
          <p id="note" class="note">This page only gives ideas. It does not change any costumes.</p>
        </div>
      </section>
    </main>
    <script>
      const characters = {
        grenade: { name: "Grenade Launcher", rarity: "Godlike", colors: ["#243c2b", "#86a96a", "#f4c95d"], tag: "Heavy jungle demolitions", idea: "Give them a dark olive demolition coat, chunky brass shoulder guards, a bandolier of small grenades, and yellow hazard stripes around the launcher. Add a cracked visor with a faint green glow so the silhouette feels powerful and dangerous." },
        machine: { name: "Machine Gunner", rarity: "Rare", colors: ["#374151", "#94a3b8", "#38bdf8"], tag: "Armored rapid-fire trooper", idea: "Use gunmetal body armor with a bright cyan ammo counter, a linked belt wrapping around the waist, and a compact helmet with one blue targeting lens. Small scratches and heat marks near the barrel would sell the nonstop firing." },
        sniper: { name: "Sniper", rarity: "Epic", colors: ["#1e293b", "#6d5c91", "#f5e6a8"], tag: "Silent long-range scout", idea: "Try a charcoal hooded cloak with muted purple panels, one long golden scope lens, and a thin scarf trailing behind. Keep most shapes narrow and clean so the character looks precise instead of bulky." },
        bomber: { name: "Bomb Dropper", rarity: "Rare", colors: ["#713f12", "#f59e0b", "#ef4444"], tag: "Unstable blast technician", idea: "Build the costume around a padded orange blast suit, a big round backpack with blinking red lights, and a flip-down welding mask. Add singed edges and soot spots to make it look like their experiments often go wrong." },
        swordsman: { name: "Swordsman", rarity: "Common", colors: ["#e5e7eb", "#475569", "#60a5fa"], tag: "Fast wandering blade", idea: "Give them a short white duelist coat, slate-blue wraps, a silver half-mask, and a bright blue sash that curves with the sword swing. A circular guard on the sword would emphasize the spinning attack." },
        ninja: { name: "Ninja", rarity: "Epic", colors: ["#15112c", "#7c3aed", "#d8b4fe"], tag: "Spiked shadow striker", idea: "Use near-black cloth with layered purple wraps, a narrow glowing eye slit, and small angular spikes on the forearms and scarf tips. A shuriken emblem on the belt would connect the costume to the spiky projectiles." },
        flamethrower: { name: "Flamethrower", rarity: "Rare", colors: ["#431407", "#ea580c", "#fde047"], tag: "Walking furnace operator", idea: "Try a dark heatproof suit with orange ceramic plates, twin fuel tanks, a yellow glass face shield, and tiny pilot flames on the backpack. Heat-gradient metal on the nozzle would make it feel recently fired." },
        boomerang: { name: "Boomerang Thrower", rarity: "Common", colors: ["#3f2a1d", "#d97706", "#fef3c7"], tag: "Quick outback hunter", idea: "Give them a cropped brown trail jacket, warm orange scarf, cream arm wraps, and several small boomerangs clipped across the back. Use curved patterns everywhere so the whole outfit echoes the returning shot." },
        ice: { name: "Ice Mage", rarity: "Epic", colors: ["#1e3a8a", "#7dd3fc", "#ecfeff"], tag: "Frozen crystal sorcerer", idea: "Create a deep-blue robe with sharp translucent shoulder crystals, a crown shaped like skinny icebergs, and white frost spreading up the arms. A pale glow inside the chest could make the costume feel magically frozen from within." },
        rocket: { name: "Rocket Jumper", rarity: "Legendary", colors: ["#7f1d1d", "#fb7185", "#fbbf24"], tag: "High-speed sky ace", idea: "Use a crimson flight jacket, gold-edged goggles, small stabilizer fins on the boots, and a compact rocket pack with warning decals. Add a wind-swept scarf to make the character look fast even while standing still." },
        shield: { name: "Shield Guardian", rarity: "Legendary", colors: ["#1e3a5f", "#94a3b8", "#f8fafc"], tag: "Unbreakable arena sentinel", idea: "Give them silver-blue plate armor, a tall crested helmet, and a glowing shield emblem centered on the chest. Broad shoulders and repeating hexagon details would make the costume feel protective and nearly immovable." },
        portal: { name: "Portal Blaster", rarity: "Godlike", colors: ["#3b0764", "#7c3aed", "#22d3ee"], tag: "Reality-bending traveler", idea: "Try a deep violet space suit split by cyan glowing seams, with one circular portal lens over the face and two small portal rings hovering behind the shoulders. Parts of the arms could fade into starry speckles as if they are between places." },
        harpoon: { name: "Harpooner", rarity: "Common", colors: ["#334155", "#0f766e", "#f97316"], tag: "Rugged deep-sea hunter", idea: "Use a weathered teal deck coat, heavy gray boots, orange rope wrapped around one shoulder, and a metal diving visor. A hook-shaped belt buckle and salt-stained fabric would add character without making it too busy." },
        teleporter: { name: "Teleporter", rarity: "Legendary", colors: ["#111827", "#9333ea", "#38bdf8"], tag: "Lightning-fast phase runner", idea: "Give them a sleek black speed suit with jagged purple lightning lines, bright blue ankle coils, and a split visor. Broken, offset bands around the limbs would make the body look like it is constantly phasing." },
        drone: { name: "Drone Controller", rarity: "Godlike", colors: ["#052e2b", "#34d399", "#67e8f9"], tag: "Elite airborne commander", idea: "Try a dark green command coat with cyan hologram cuffs, a one-eye control headset, and a miniature drone dock on the back. Add glowing directional arrows so the outfit feels like a high-tech flight-control station." }
      };
      const rarityColors = { Common: "#d1d5db", Rare: "#60a5fa", Epic: "#c084fc", Legendary: "#f59e0b", Godlike: "#ef4444" };
      const select = document.querySelector("#character");
      Object.entries(characters).forEach(([id, character]) => select.add(new Option(character.name, id)));
      const canvas = document.querySelector("#preview"), ctx = canvas.getContext("2d");
      function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
      function drawDefault(character) {
        const [dark, body, accent] = character.colors;
        ctx.clearRect(0, 0, 420, 420); ctx.save(); ctx.translate(210, 58);
        ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.fillStyle = dark; roundRect(-45, 42, 90, 74, 24); ctx.shadowBlur = 0;
        ctx.fillStyle = accent; ctx.fillRect(9, 68, 23, 9); ctx.fillStyle = "#080b14"; ctx.fillRect(20, 78, 13, 10);
        ctx.fillStyle = body; roundRect(-58, 112, 116, 150, 25); ctx.fillStyle = dark; ctx.fillRect(-58, 145, 116, 19);
        ctx.strokeStyle = dark; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-37, 250); ctx.lineTo(-58, 329); ctx.moveTo(37, 250); ctx.lineTo(58, 329); ctx.moveTo(-52, 143); ctx.lineTo(-94, 221); ctx.moveTo(52, 143); ctx.lineTo(104, 194); ctx.stroke();
        ctx.strokeStyle = accent; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(72, 188); ctx.lineTo(138, 188); ctx.stroke(); ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(139, 188, 13, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      function render() {
        const id = select.value, c = characters[id], rarity = rarityColors[c.rarity];
        document.documentElement.style.setProperty("--accent", c.colors[2]); document.documentElement.style.setProperty("--glow", c.colors[1] + "55"); document.documentElement.style.setProperty("--rarity", rarity);
        document.querySelector("#name").textContent = c.name; document.querySelector("#tagline").textContent = c.tag; document.querySelector("#suggestion").textContent = c.idea; document.querySelector("#rarity").textContent = c.rarity;
        document.querySelector("#swatches").innerHTML = c.colors.map(color => `<span class="swatch" style="background:${color}" title="${color}"></span>`).join("");
        const saved = localStorage.getItem(`kitClashCharacterDrawing:${id}`);
        if (!saved) { drawDefault(c); return; }
        const image = new Image(); image.onload = () => { ctx.clearRect(0, 0, 420, 420); ctx.drawImage(image, 25, 25, 370, 370); }; image.onerror = () => drawDefault(c); image.src = saved;
      }
      select.addEventListener("change", render); render();
    </script>
  </body>
</html>
