<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Stickman Drawing Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f16;
        --panel: #151a23;
        --line: #293142;
        --text: #f4f7fb;
        --muted: #a7b0c1;
        --accent: #facc15;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 8%, rgba(250, 204, 21, 0.15), transparent 24rem),
          radial-gradient(circle at 82% 2%, rgba(56, 189, 248, 0.16), transparent 26rem),
          linear-gradient(135deg, #0b0f16 0%, #141923 55%, #080a0f 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1220px, calc(100vw - 24px));
        height: 100vh;
        margin: 0 auto;
        padding: 70px 0 12px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 10px;
      }

      .topbar,
      .studio {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(21, 26, 35, 0.9);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 34px);
        letter-spacing: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
      }

      .page-nav {
        position: fixed;
        z-index: 50;
        top: 18px;
        left: 18px;
        display: flex;
        gap: 14px;
      }

      .page-nav a {
        min-width: 90px;
        padding: 9px 14px;
        border: 2px solid rgba(255,255,255,.3);
        border-radius: 10px;
        color: #111827;
        background: rgba(255,255,255,.95);
        text-align: center;
        text-decoration: none;
        box-shadow: 0 8px 22px rgba(0,0,0,.28);
      }

      button,
      a {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #e8eef8 100%);
        color: #10151f;
        cursor: pointer;
        font: inherit;
        font-weight: 850;
        padding: 9px 13px;
        text-decoration: none;
      }

      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: #fde68a;
      }

      button:active,
      button.click-confirmed {
        color: #ffffff;
        background: #111827;
        transform: translateY(1px) scale(.98);
      }

      button:disabled {
        border-color: rgba(244, 247, 251, 0.1);
        background: #202633;
        color: #657084;
        cursor: not-allowed;
      }

      .swatch {
        width: 34px;
        height: 34px;
        padding: 0;
      }

      .swatch[aria-pressed="true"] {
        outline: 3px solid #f4f7fb;
        outline-offset: 2px;
      }

      .swatch.clear-color {
        background:
          linear-gradient(45deg, #f4f7fb 25%, transparent 25%),
          linear-gradient(-45deg, #f4f7fb 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #f4f7fb 75%),
          linear-gradient(-45deg, transparent 75%, #f4f7fb 75%),
          #778293;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      label {
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
      }

      input[type="range"] {
        width: 120px;
      }

      select {
        border: 1px solid rgba(244, 247, 251, 0.22);
        border-radius: 7px;
        background: #10151f;
        color: var(--text);
        font: inherit;
        font-weight: 800;
        padding: 8px 10px;
      }

      .studio {
        min-height: 0;
        padding: 10px;
        display: grid;
        align-items: center;
        justify-items: center;
        overflow: hidden;
      }

      .canvas-shell {
        position: relative;
        min-height: 0;
        width: min(100%, 760px, calc((100vh - 170px) * 1200 / 760));
        max-width: 100%;
        aspect-ratio: 1200 / 760;
        border-radius: 8px;
        background:
          linear-gradient(45deg, rgba(203, 213, 225, 0.46) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(203, 213, 225, 0.46) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(203, 213, 225, 0.46) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(203, 213, 225, 0.46) 75%),
          #f8fafc;
        background-position: 0 0, 0 18px, 18px -18px, -18px 0;
        background-size: 36px 36px;
        overflow: hidden;
      }

      .canvas-shell::after {
        content: "draw character here";
        position: absolute;
        left: 38%;
        top: 15%;
        width: 24%;
        height: 66%;
        border: 3px dashed rgba(5, 7, 13, 0.34);
        border-radius: 8px;
        color: rgba(5, 7, 13, 0.62);
        display: grid;
        place-items: start center;
        font-weight: 900;
        padding-top: 10px;
        pointer-events: none;
        z-index: 2;
      }

      canvas {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
      }

      #muzzleOverlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
        }

        main {
          height: auto;
          min-height: 100vh;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .studio {
          height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <nav class="page-nav" aria-label="Page navigation">
      <a href="index.html" onclick="if (history.length > 1) { event.preventDefault(); history.back(); }">← Back</a>
      <a href="index.html">⌂ Home</a>
    </nav>
    <main>
      <header class="topbar">
        <h1>Stickman Drawing Studio</h1>
        <div class="toolbar">
          <label>Character
            <select id="character">
              <option value="grenade">Grenade Launcher</option>
              <option value="machine">Machine Gunner</option>
              <option value="sniper">Sniper</option>
              <option value="bomber">Bomb Dropper</option>
              <option value="swordsman">Swordsman</option>
              <option value="ninja">Ninja</option>
              <option value="flamethrower">Flamethrower</option>
              <option value="boomerang">Boomerang</option>
              <option value="ice">Ice Mage</option>
              <option value="rocket">Rocket Jumper</option>
              <option value="shield">Shield Guardian</option>
              <option value="portal">Portal Blaster</option>
              <option value="harpoon">Harpooner</option>
              <option value="teleporter">Teleporter</option>
              <option value="drone">Drone Controller</option>
            </select>
          </label>
          <label>Faces
            <select id="orientation">
              <option value="right">Right</option>
              <option value="left">Left</option>
            </select>
          </label>
          <button id="brush" type="button" aria-pressed="true">Brush</button>
          <button id="line" type="button" aria-pressed="false">Line</button>
          <button id="rect" type="button" aria-pressed="false">Rectangle</button>
          <button id="circle" type="button" aria-pressed="false">Circle</button>
          <button id="triangle" type="button" aria-pressed="false">Triangle</button>
          <button id="fill" type="button" aria-pressed="false">Fill</button>
          <button id="textTool" type="button" aria-pressed="false">Text</button>
          <label>Text <input id="textValue" type="text" value="HP" size="8"></label>
          <button id="muzzleTool" type="button" aria-pressed="false">Gun Point</button>
          <button id="eraser" type="button" aria-pressed="false">Eraser</button>
          <label>Size <input id="size" type="range" min="2" max="28" value="5"></label>
          <button class="swatch" type="button" data-color="#05070d" aria-pressed="true" style="background:#05070d"></button>
          <button class="swatch clear-color" type="button" data-clear="true" aria-pressed="false" title="Clear color"></button>
          <button class="swatch" type="button" data-color="#f4f7fb" aria-pressed="false" style="background:#f4f7fb"></button>
          <button class="swatch" type="button" data-color="#cbd5e1" aria-pressed="false" style="background:#cbd5e1"></button>
          <button class="swatch" type="button" data-color="#334155" aria-pressed="false" style="background:#334155"></button>
          <button class="swatch" type="button" data-color="#fde047" aria-pressed="false" style="background:#fde047"></button>
          <button class="swatch" type="button" data-color="#ffff00" aria-pressed="false" style="background:#ffff00"></button>
          <button class="swatch" type="button" data-color="#a16207" aria-pressed="false" style="background:#a16207"></button>
          <button class="swatch" type="button" data-color="#7dd3fc" aria-pressed="false" style="background:#7dd3fc"></button>
          <button class="swatch" type="button" data-color="#0000ff" aria-pressed="false" style="background:#0000ff"></button>
          <button class="swatch" type="button" data-color="#0369a1" aria-pressed="false" style="background:#0369a1"></button>
          <button class="swatch" type="button" data-color="#fb7185" aria-pressed="false" style="background:#fb7185"></button>
          <button class="swatch" type="button" data-color="#ff0000" aria-pressed="false" style="background:#ff0000"></button>
          <button class="swatch" type="button" data-color="#9f1239" aria-pressed="false" style="background:#9f1239"></button>
          <button class="swatch" type="button" data-color="#a3e635" aria-pressed="false" style="background:#a3e635"></button>
          <button class="swatch" type="button" data-color="#00ff00" aria-pressed="false" style="background:#00ff00"></button>
          <button class="swatch" type="button" data-color="#047857" aria-pressed="false" style="background:#047857"></button>
          <button class="swatch" type="button" data-color="#c4b5fd" aria-pressed="false" style="background:#c4b5fd"></button>
          <button class="swatch" type="button" data-color="#8000ff" aria-pressed="false" style="background:#8000ff"></button>
          <button class="swatch" type="button" data-color="#5b21b6" aria-pressed="false" style="background:#5b21b6"></button>
          <button class="swatch" type="button" data-color="#fdba74" aria-pressed="false" style="background:#fdba74"></button>
          <button class="swatch" type="button" data-color="#ff8000" aria-pressed="false" style="background:#ff8000"></button>
          <button class="swatch" type="button" data-color="#c2410c" aria-pressed="false" style="background:#c2410c"></button>
          <button class="swatch" type="button" data-color="#f9a8d4" aria-pressed="false" style="background:#f9a8d4"></button>
          <button class="swatch" type="button" data-color="#ff00ff" aria-pressed="false" style="background:#ff00ff"></button>
          <button class="swatch" type="button" data-color="#be185d" aria-pressed="false" style="background:#be185d"></button>
          <button id="undo" type="button">Undo</button>
          <button id="clear" type="button">Clear</button>
          <button id="useGame" type="button">Use in Game</button>
          <button id="save" type="button">Save PNG</button>
          <button id="exportCostumes" type="button">Export Costumes</button>
          <button id="importCostumes" type="button">Import Costumes</button>
          <input id="importCostumesFile" type="file" accept="application/json,.json,image/png,.png" hidden>
        </div>
      </header>

      <section class="studio" aria-label="Drawing canvas">
        <div class="canvas-shell">
          <canvas id="board" width="1200" height="760"></canvas>
          <canvas id="muzzleOverlay" width="1200" height="760" aria-hidden="true"></canvas>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.querySelector("#board");
      const ctx = canvas.getContext("2d");
      const muzzleOverlay = document.querySelector("#muzzleOverlay");
      const muzzleOverlayCtx = muzzleOverlay.getContext("2d");
      const brushButton = document.querySelector("#brush");
      const lineButton = document.querySelector("#line");
      const rectButton = document.querySelector("#rect");
      const circleButton = document.querySelector("#circle");
      const triangleButton = document.querySelector("#triangle");
      const fillButton = document.querySelector("#fill");
      const textToolButton = document.querySelector("#textTool");
      const textValueInput = document.querySelector("#textValue");
      const muzzleToolButton = document.querySelector("#muzzleTool");
      const eraserButton = document.querySelector("#eraser");
      const characterSelect = document.querySelector("#character");
      const orientationSelect = document.querySelector("#orientation");
      const sizeInput = document.querySelector("#size");
      const undoButton = document.querySelector("#undo");
      const clearButton = document.querySelector("#clear");
      const useGameButton = document.querySelector("#useGame");
      const saveButton = document.querySelector("#save");
      const exportCostumesButton = document.querySelector("#exportCostumes");
      const importCostumesButton = document.querySelector("#importCostumes");
      const importCostumesFile = document.querySelector("#importCostumesFile");
      const swatches = [...document.querySelectorAll(".swatch")];
      const drawingStoragePrefix = "kitClashCharacterDrawing:";
      const activeStoragePrefix = "kitClashCharacterActive:";
      const muzzleStoragePrefix = "kitClashCharacterMuzzle:";
      const orientationStoragePrefix = "kitClashCharacterOrientation:";
      const grenadeDraftKey = "kitClashCharacterDraft:grenade";
      const grenadeDraftVersionKey = "kitClashCharacterDraftVersion:grenade";
      const grenadeDraftVersion = "3";

      let drawing = false;
      let lastPoint = null;
      let startPoint = null;
      let linePreview = null;
      let color = "#05070d";
      let clearColor = false;
      let tool = "brush";
      let currentCharacter = characterSelect.value;
      let activePaintLayer = null;
      let activePaintCtx = null;
      let paintLayers = [];
      let drawingLoadToken = 0;
      let grenadeFacing = localStorage.getItem("kitClashCharacterOrientation:grenade") === "right" ? "right" : "left";
      const characterCanvasDrafts = new Map();
      const history = [];

      function blankCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function makePaintLayer() {
        const layer = document.createElement("canvas");
        layer.width = canvas.width;
        layer.height = canvas.height;
        return { canvas: layer, ctx: layer.getContext("2d") };
      }

      function resetPaintLayersFromCanvas() {
        const layer = makePaintLayer();
        layer.ctx.drawImage(canvas, 0, 0);
        paintLayers = [layer.canvas];
        activePaintLayer = null;
        activePaintCtx = null;
      }

      function renderPaintLayers(extraLayer = null) {
        blankCanvas();
        paintLayers.forEach((layer) => ctx.drawImage(layer, 0, 0));
        if (extraLayer) ctx.drawImage(extraLayer, 0, 0);
      }

      function commitActivePaintLayer() {
        if (!activePaintLayer) return;
        paintLayers.push(activePaintLayer.canvas);
        activePaintLayer = null;
        activePaintCtx = null;
        renderPaintLayers();
      }

      function resetCanvas() {
        blankCanvas();
        resetPaintLayersFromCanvas();
        pushHistory();
      }

      function storageKey(characterId = currentCharacter) {
        return `${drawingStoragePrefix}${characterId}`;
      }

      function muzzleKey(characterId = currentCharacter) {
        return `${muzzleStoragePrefix}${characterId}`;
      }

      function canUseMuzzle(characterId = currentCharacter) {
        return characterId !== "teleporter" && characterId !== "drone";
      }

      function updateMuzzleToolAvailability() {
        const enabled = canUseMuzzle();
        muzzleToolButton.textContent = currentCharacter === "swordsman" ? "Sword Pivot" : "Gun Point";
        muzzleToolButton.disabled = !enabled;
        muzzleToolButton.hidden = !enabled;
        if (!enabled && tool === "muzzle") setTool("brush");
        drawMuzzleOverlay();
      }

      function orientationKey(characterId = currentCharacter) {
        return `${orientationStoragePrefix}${characterId}`;
      }

      function transparentDataUrl() {
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = canvas.width;
        exportCanvas.height = canvas.height;
        const exportCtx = exportCanvas.getContext("2d", { willReadFrequently: true });
        exportCtx.drawImage(canvas, 0, 0);
        const image = exportCtx.getImageData(0, 0, exportCanvas.width, exportCanvas.height);
        const data = image.data;
        for (let i = 0; i < data.length; i += 4) {
          const isOldPaper = data[i] >= 246 && data[i] <= 250 && data[i + 1] >= 248 && data[i + 1] <= 252 && data[i + 2] >= 250 && data[i + 2] <= 255;
          if (isOldPaper) data[i + 3] = 0;
        }
        exportCtx.putImageData(image, 0, 0);
        return exportCanvas.toDataURL("image/png");
      }

      function removeOldPaperPixels() {
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = image.data;
        for (let i = 0; i < data.length; i += 4) {
          const isOldPaper = data[i] >= 246 && data[i] <= 250 && data[i + 1] >= 248 && data[i + 1] <= 252 && data[i + 2] >= 250 && data[i + 2] <= 255;
          if (isOldPaper) data[i + 3] = 0;
        }
        ctx.putImageData(image, 0, 0);
      }

      function saveDrawingToGame(characterId = currentCharacter, commitToGame = false) {
        const drawing = transparentDataUrl();
        if (!commitToGame) {
          // Drafts stay isolated by character and do not depend on localStorage
          // capacity. Only Use in Game commits a drawing to persistent storage.
          characterCanvasDrafts.set(characterId, drawing);
        } else {
          localStorage.setItem(storageKey(characterId), drawing);
        }
        if (characterId !== "grenade") localStorage.setItem(orientationKey(characterId), orientationSelect.value);
        // This flag is the commit marker, so it must be the final write.
        if (characterId === "grenade" && commitToGame) localStorage.setItem("kitClashGrenadeConceptActive", "7");
      }

      function saveMuzzlePoint(point, characterId = currentCharacter) {
        if (!canUseMuzzle(characterId)) {
          localStorage.removeItem(muzzleKey(characterId));
          drawMuzzleOverlay();
          return;
        }
        localStorage.setItem(muzzleKey(characterId), JSON.stringify({ x: point.x / canvas.width, y: point.y / canvas.height }));
        if (characterId === currentCharacter) drawMuzzleOverlay();
      }

      function savedMuzzlePoint(characterId = currentCharacter) {
        if (!canUseMuzzle(characterId)) return null;
        const saved = localStorage.getItem(muzzleKey(characterId));
        if (!saved) return null;
        try {
          const point = JSON.parse(saved);
          if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) return null;
          return { x: point.x * canvas.width, y: point.y * canvas.height };
        } catch {
          return null;
        }
      }

      function drawMuzzleOverlay() {
        muzzleOverlayCtx.clearRect(0, 0, muzzleOverlay.width, muzzleOverlay.height);
        const point = savedMuzzlePoint();
        if (!point) return;
        muzzleOverlayCtx.save();
        muzzleOverlayCtx.strokeStyle = "#facc15";
        muzzleOverlayCtx.fillStyle = "rgba(5,7,13,0.82)";
        muzzleOverlayCtx.lineWidth = 5;
        muzzleOverlayCtx.beginPath();
        muzzleOverlayCtx.arc(point.x, point.y, 13, 0, Math.PI * 2);
        muzzleOverlayCtx.fill();
        muzzleOverlayCtx.stroke();
        muzzleOverlayCtx.strokeStyle = "#38bdf8";
        muzzleOverlayCtx.lineWidth = 4;
        muzzleOverlayCtx.beginPath();
        muzzleOverlayCtx.moveTo(point.x - 22, point.y);
        muzzleOverlayCtx.lineTo(point.x + 22, point.y);
        muzzleOverlayCtx.moveTo(point.x, point.y - 22);
        muzzleOverlayCtx.lineTo(point.x, point.y + 22);
        muzzleOverlayCtx.stroke();
        muzzleOverlayCtx.fillStyle = "#f4f7fb";
        muzzleOverlayCtx.font = "900 18px system-ui, sans-serif";
        muzzleOverlayCtx.textAlign = "center";
        muzzleOverlayCtx.textBaseline = "middle";
        muzzleOverlayCtx.fillText(currentCharacter === "swordsman" ? "S" : "G", point.x, point.y);
        muzzleOverlayCtx.restore();
      }

      function loadCharacterDrawing(characterId) {
        const loadToken = ++drawingLoadToken;
        history.length = 0;
        // Grenade Launcher facing is a temporary studio mirror, not saved data.
        orientationSelect.value = characterId === "grenade"
          ? grenadeFacing
          : characterId === "drone"
            ? "right"
            : localStorage.getItem(orientationKey(characterId)) || "left";
        if (!canUseMuzzle(characterId)) localStorage.removeItem(muzzleKey(characterId));
        updateMuzzleToolAvailability();
        const savedDraft = characterCanvasDrafts.get(characterId);
        const saved = savedDraft || (characterId === "grenade"
          ? "grenade-costume-preview.png?v=8"
          : characterId === "machine"
            ? "machine-gunner-costume.png?v=1"
            : characterId === "sniper"
              ? "sniper-costume.png?v=1"
              : characterId === "bomber"
                ? "bomb-dropper-costume.png?v=1"
                : characterId === "swordsman"
                  ? "swordsman-costume.png?v=1"
                  : characterId === "ninja"
                    ? "ninja-costume.png?v=1"
                    : characterId === "flamethrower"
                      ? "flamethrower-costume.png?v=2"
                      : characterId === "boomerang"
                        ? "boomerang-costume.png?v=2"
                        : characterId === "ice"
                          ? "ice-mage-costume.png?v=2"
                          : characterId === "rocket"
                            ? "rocket-jumper-costume.png?v=1"
                            : characterId === "shield"
                              ? "shield-guardian-costume.png?v=2"
                              : characterId === "portal"
                                ? "portal-blaster-costume.png?v=1"
                                : characterId === "harpoon"
                                  ? "harpooner-costume.png?v=1"
                                  : characterId === "teleporter"
                                    ? "teleporter-costume.png?v=2"
                                    : characterId === "drone"
                                      ? "drone-controller-costume.png?v=3"
                  : localStorage.getItem(storageKey(characterId)));
        if (!saved) {
          blankCanvas();
          resetPaintLayersFromCanvas();
          drawMuzzleOverlay();
          pushHistory();
          return;
        }
        // Clear the previous character immediately instead of leaving it visible
        // while the newly selected costume image is decoding.
        blankCanvas();
        resetPaintLayersFromCanvas();
        drawMuzzleOverlay();
        const image = new Image();
        image.onload = () => {
          if (loadToken !== drawingLoadToken || characterId !== currentCharacter) return;
          blankCanvas();
          if (characterId === "grenade" && grenadeFacing === "left" && !savedDraft) {
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            ctx.restore();
          } else if (characterId === "drone" && !savedDraft) {
            // Portrait costume art must keep its natural aspect ratio. Stretching
            // it across the landscape board made Drone Controller look squished.
            const scale = Math.min(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
            const width = image.naturalWidth * scale;
            const height = image.naturalHeight * scale;
            ctx.drawImage(image, (canvas.width - width) / 2, canvas.height - height, width, height);
          } else {
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          }
          removeOldPaperPixels();
          resetPaintLayersFromCanvas();
          drawMuzzleOverlay();
          pushHistory();
        };
        image.src = saved;
      }

      function pushHistory() {
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (history.length > 30) history.shift();
        undoButton.disabled = history.length <= 1;
      }

      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * canvas.width,
          y: ((event.clientY - rect.top) / rect.height) * canvas.height,
        };
      }

      function drawStroke(from, to) {
        if (clearColor && tool !== "eraser") {
          clearTopPaintStroke(from, to);
          return;
        }
        const targetCtx = activePaintCtx || ctx;
        targetCtx.save();
        targetCtx.lineCap = "round";
        targetCtx.lineJoin = "round";
        targetCtx.lineWidth = Number(sizeInput.value);
        if (tool === "eraser") targetCtx.globalCompositeOperation = "destination-out";
        targetCtx.strokeStyle = tool === "eraser" ? "rgba(0,0,0,1)" : color;
        targetCtx.beginPath();
        targetCtx.moveTo(from.x, from.y);
        const midX = (from.x + to.x) / 2;
        const midY = (from.y + to.y) / 2;
        targetCtx.quadraticCurveTo(from.x, from.y, midX, midY);
        targetCtx.stroke();
        targetCtx.restore();
      }

      function drawStraightLine(from, to) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = Number(sizeInput.value);
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
        ctx.restore();
      }

      function isShapeTool() {
        return ["line", "rect", "circle", "triangle"].includes(tool);
      }

      function traceShapePath(targetCtx, from, to) {
        if (tool === "line") {
          targetCtx.moveTo(from.x, from.y);
          targetCtx.lineTo(to.x, to.y);
        } else if (tool === "rect") {
          targetCtx.rect(from.x, from.y, to.x - from.x, to.y - from.y);
        } else if (tool === "circle") {
          const centerX = (from.x + to.x) / 2;
          const centerY = (from.y + to.y) / 2;
          targetCtx.ellipse(centerX, centerY, Math.abs(to.x - from.x) / 2, Math.abs(to.y - from.y) / 2, 0, 0, Math.PI * 2);
        } else if (tool === "triangle") {
          targetCtx.moveTo((from.x + to.x) / 2, from.y);
          targetCtx.lineTo(to.x, to.y);
          targetCtx.lineTo(from.x, to.y);
          targetCtx.closePath();
        }
      }

      function drawShape(from, to, targetCtx = ctx) {
        targetCtx.save();
        targetCtx.lineCap = "round";
        targetCtx.lineJoin = "round";
        targetCtx.lineWidth = Number(sizeInput.value);
        targetCtx.strokeStyle = clearColor ? "rgba(255,255,255,0.78)" : color;
        targetCtx.beginPath();
        traceShapePath(targetCtx, from, to);
        targetCtx.stroke();
        targetCtx.restore();
      }

      function clearBoundsForPoints(from, to) {
        const pad = Number(sizeInput.value) + 8;
        return {
          x: Math.max(0, Math.floor(Math.min(from.x, to.x) - pad)),
          y: Math.max(0, Math.floor(Math.min(from.y, to.y) - pad)),
          w: Math.min(canvas.width, Math.ceil(Math.max(from.x, to.x) + pad)) - Math.max(0, Math.floor(Math.min(from.x, to.x) - pad)),
          h: Math.min(canvas.height, Math.ceil(Math.max(from.y, to.y) + pad)) - Math.max(0, Math.floor(Math.min(from.y, to.y) - pad)),
        };
      }

      function clearTopPaintStroke(from, to) {
        const bounds = clearBoundsForPoints(from, to);
        const mask = document.createElement("canvas");
        mask.width = canvas.width;
        mask.height = canvas.height;
        const maskCtx = mask.getContext("2d");
        maskCtx.lineCap = "round";
        maskCtx.lineJoin = "round";
        maskCtx.lineWidth = Number(sizeInput.value);
        maskCtx.strokeStyle = "#000";
        maskCtx.beginPath();
        maskCtx.moveTo(from.x, from.y);
        const midX = (from.x + to.x) / 2;
        const midY = (from.y + to.y) / 2;
        maskCtx.quadraticCurveTo(from.x, from.y, midX, midY);
        maskCtx.stroke();
        clearTopPaintWithMask(mask, bounds);
      }

      function clearTopPaintShape(from, to) {
        const bounds = clearBoundsForPoints(from, to);
        const mask = document.createElement("canvas");
        mask.width = canvas.width;
        mask.height = canvas.height;
        const maskCtx = mask.getContext("2d");
        maskCtx.lineCap = "round";
        maskCtx.lineJoin = "round";
        maskCtx.lineWidth = Number(sizeInput.value);
        maskCtx.strokeStyle = "#000";
        maskCtx.beginPath();
        traceShapePath(maskCtx, from, to);
        maskCtx.stroke();
        clearTopPaintWithMask(mask, bounds);
      }

      function clearTopPaintWithMask(mask, bounds) {
        if (bounds.w <= 0 || bounds.h <= 0 || paintLayers.length === 0) return;
        const maskData = mask.getContext("2d").getImageData(bounds.x, bounds.y, bounds.w, bounds.h).data;
        const packets = paintLayers.map((layer) => {
          const layerCtx = layer.getContext("2d");
          return { layerCtx, image: layerCtx.getImageData(bounds.x, bounds.y, bounds.w, bounds.h), changed: false };
        });
        for (let i = 0; i < maskData.length; i += 4) {
          if (maskData[i + 3] === 0) continue;
          for (let layerIndex = packets.length - 1; layerIndex >= 0; layerIndex -= 1) {
            const data = packets[layerIndex].image.data;
            if (data[i + 3] === 0) continue;
            data[i + 3] = 0;
            packets[layerIndex].changed = true;
            break;
          }
        }
        packets.forEach((packet) => {
          if (packet.changed) packet.layerCtx.putImageData(packet.image, bounds.x, bounds.y);
        });
        renderPaintLayers();
      }

      function colorToRgba(hex) {
        const value = Number.parseInt(hex.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255, 255];
      }

      function colorsClose(data, index, target, tolerance = 28) {
        return (
          Math.abs(data[index] - target[0]) <= tolerance &&
          Math.abs(data[index + 1] - target[1]) <= tolerance &&
          Math.abs(data[index + 2] - target[2]) <= tolerance &&
          Math.abs(data[index + 3] - target[3]) <= tolerance
        );
      }

      function floodFill(point) {
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = image.data;
        const startX = Math.floor(point.x);
        const startY = Math.floor(point.y);
        if (startX < 0 || startY < 0 || startX >= canvas.width || startY >= canvas.height) return;
        const startIndex = (startY * canvas.width + startX) * 4;
        const target = [data[startIndex], data[startIndex + 1], data[startIndex + 2], data[startIndex + 3]];
        const fill = colorToRgba(color);
        if (colorsClose(fill, 0, target, 0)) return;

        const stack = [[startX, startY]];
        const seen = new Uint8Array(canvas.width * canvas.height);
        while (stack.length > 0) {
          const [x, y] = stack.pop();
          if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
          const pixel = y * canvas.width + x;
          if (seen[pixel]) continue;
          seen[pixel] = 1;
          const index = pixel * 4;
          if (!colorsClose(data, index, target)) continue;
          data[index] = fill[0];
          data[index + 1] = fill[1];
          data[index + 2] = fill[2];
          data[index + 3] = fill[3];
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        ctx.putImageData(image, 0, 0);
      }

      function clearTopPaintFlood(point) {
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = image.data;
        const startX = Math.floor(point.x);
        const startY = Math.floor(point.y);
        if (startX < 0 || startY < 0 || startX >= canvas.width || startY >= canvas.height) return;
        const startIndex = (startY * canvas.width + startX) * 4;
        const target = [data[startIndex], data[startIndex + 1], data[startIndex + 2], data[startIndex + 3]];
        const mask = document.createElement("canvas");
        mask.width = canvas.width;
        mask.height = canvas.height;
        const maskCtx = mask.getContext("2d");
        const maskImage = maskCtx.getImageData(0, 0, canvas.width, canvas.height);
        const maskData = maskImage.data;
        const stack = [[startX, startY]];
        const seen = new Uint8Array(canvas.width * canvas.height);
        let minX = startX;
        let minY = startY;
        let maxX = startX;
        let maxY = startY;
        while (stack.length > 0) {
          const [x, y] = stack.pop();
          if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
          const pixel = y * canvas.width + x;
          if (seen[pixel]) continue;
          seen[pixel] = 1;
          const index = pixel * 4;
          if (!colorsClose(data, index, target)) continue;
          maskData[index + 3] = 255;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        maskCtx.putImageData(maskImage, 0, 0);
        clearTopPaintWithMask(mask, { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 });
      }

      function drawText(point) {
        const text = textValueInput.value.trim();
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = `900 ${Math.max(12, Number(sizeInput.value) * 4)}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, point.x, point.y);
        ctx.restore();
      }

      function markMuzzle(point) {
        if (!canUseMuzzle()) return;
        saveMuzzlePoint(point);
      }

      canvas.addEventListener("pointerdown", (event) => {
        if (tool === "muzzle") {
          markMuzzle(pointFromEvent(event));
          return;
        }
        if (tool === "fill") {
          if (clearColor) {
            clearTopPaintFlood(pointFromEvent(event));
          } else {
            floodFill(pointFromEvent(event));
            resetPaintLayersFromCanvas();
          }
          saveDrawingToGame();
          pushHistory();
          return;
        }
        if (tool === "text") {
          drawText(pointFromEvent(event));
          resetPaintLayersFromCanvas();
          saveDrawingToGame();
          pushHistory();
          return;
        }
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        lastPoint = pointFromEvent(event);
        startPoint = lastPoint;
        if (isShapeTool()) {
          linePreview = ctx.getImageData(0, 0, canvas.width, canvas.height);
        } else if (!clearColor && tool !== "eraser") {
          activePaintLayer = makePaintLayer();
          activePaintCtx = activePaintLayer.ctx;
        }
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!drawing || !lastPoint) return;
        const nextPoint = pointFromEvent(event);
        if (isShapeTool()) {
          ctx.putImageData(linePreview, 0, 0);
          drawShape(startPoint, nextPoint);
        } else {
          drawStroke(lastPoint, nextPoint);
          if (activePaintLayer) renderPaintLayers(activePaintLayer.canvas);
          lastPoint = nextPoint;
        }
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!drawing) return;
        if (isShapeTool() && startPoint) {
          ctx.putImageData(linePreview, 0, 0);
          const endPoint = pointFromEvent(event);
          if (clearColor) {
            clearTopPaintShape(startPoint, endPoint);
          } else {
            activePaintLayer = makePaintLayer();
            activePaintCtx = activePaintLayer.ctx;
            drawShape(startPoint, endPoint, activePaintCtx);
            commitActivePaintLayer();
          }
        } else {
          commitActivePaintLayer();
        }
        drawing = false;
        lastPoint = null;
        startPoint = null;
        linePreview = null;
        if (tool === "eraser") resetPaintLayersFromCanvas();
        saveDrawingToGame();
        pushHistory();
      });

      canvas.addEventListener("pointercancel", () => {
        drawing = false;
        lastPoint = null;
        startPoint = null;
        linePreview = null;
      });

      function setTool(nextTool) {
        tool = nextTool;
        brushButton.setAttribute("aria-pressed", String(tool === "brush"));
        lineButton.setAttribute("aria-pressed", String(tool === "line"));
        rectButton.setAttribute("aria-pressed", String(tool === "rect"));
        circleButton.setAttribute("aria-pressed", String(tool === "circle"));
        triangleButton.setAttribute("aria-pressed", String(tool === "triangle"));
        fillButton.setAttribute("aria-pressed", String(tool === "fill"));
        textToolButton.setAttribute("aria-pressed", String(tool === "text"));
        muzzleToolButton.setAttribute("aria-pressed", String(tool === "muzzle"));
        eraserButton.setAttribute("aria-pressed", String(tool === "eraser"));
      }

      brushButton.addEventListener("click", () => setTool("brush"));
      lineButton.addEventListener("click", () => setTool("line"));
      rectButton.addEventListener("click", () => setTool("rect"));
      circleButton.addEventListener("click", () => setTool("circle"));
      triangleButton.addEventListener("click", () => setTool("triangle"));
      fillButton.addEventListener("click", () => setTool("fill"));
      textToolButton.addEventListener("click", () => setTool("text"));
      muzzleToolButton.addEventListener("click", () => setTool("muzzle"));
      eraserButton.addEventListener("click", () => setTool("eraser"));

      swatches.forEach((swatch) => {
        swatch.addEventListener("click", () => {
          clearColor = swatch.dataset.clear === "true";
          if (!clearColor) color = swatch.dataset.color;
          swatches.forEach((item) => item.setAttribute("aria-pressed", String(item === swatch)));
          setTool(tool === "eraser" ? "brush" : tool);
        });
      });

      undoButton.addEventListener("click", () => {
        if (history.length <= 1) return;
        history.pop();
        ctx.putImageData(history[history.length - 1], 0, 0);
        resetPaintLayersFromCanvas();
        saveDrawingToGame();
        undoButton.disabled = history.length <= 1;
      });

      clearButton.addEventListener("click", () => {
        blankCanvas();
        resetPaintLayersFromCanvas();
        drawMuzzleOverlay();
        saveDrawingToGame();
        pushHistory();
      });

      characterSelect.addEventListener("change", () => {
        // Snapshot the old canvas first, then always advance to the new character.
        // A storage failure must never prevent the selection from changing.
        try {
          saveDrawingToGame(currentCharacter, false);
        } catch (error) {
          console.error("Could not keep the previous character draft.", error);
        }
        currentCharacter = characterSelect.value;
        blankCanvas();
        resetPaintLayersFromCanvas();
        muzzleOverlayCtx.clearRect(0, 0, muzzleOverlay.width, muzzleOverlay.height);
        loadCharacterDrawing(currentCharacter);
      });

      orientationSelect.addEventListener("change", () => {
        if (currentCharacter === "grenade") {
          grenadeFacing = orientationSelect.value;
          const flipped = document.createElement("canvas");
          flipped.width = canvas.width;
          flipped.height = canvas.height;
          flipped.getContext("2d").drawImage(canvas, 0, 0);
          blankCanvas();
          ctx.save();
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(flipped, 0, 0);
          ctx.restore();
          resetPaintLayersFromCanvas();
          drawMuzzleOverlay();
          pushHistory();
          return;
        }
        localStorage.setItem(orientationKey(), orientationSelect.value);
      });

      useGameButton.addEventListener("click", () => {
        try {
          if (currentCharacter === "grenade") {
            // The verified Grenade Launcher PNG is a project asset, so activation
            // only needs a tiny marker. Exporting the full 1200x760 canvas here can
            // exceed localStorage's quota and is not used by the game renderer.
            localStorage.removeItem("kitClashCharacterAnimation:grenade");
            localStorage.setItem(orientationKey("grenade"), grenadeFacing);
            saveMuzzlePoint({
              x: canvas.width * (grenadeFacing === "right" ? 0.716 : 0.284),
              y: canvas.height * 0.42,
            }, "grenade");
            localStorage.setItem("kitClashGrenadeConceptActive", "7");
          } else if (currentCharacter === "machine") {
            localStorage.removeItem("kitClashCharacterAnimation:machine");
            orientationSelect.value = "left";
            localStorage.setItem(orientationKey("machine"), "left");
            saveMuzzlePoint({ x: canvas.width * 0.332, y: canvas.height * 0.524 }, "machine");
            localStorage.setItem("kitClashMachineConceptActive", "1");
          } else if (currentCharacter === "sniper") {
            // Sniper is a permanent project asset and is already available in the
            // game. Avoid localStorage writes, which can fail when costume storage
            // is full.
            localStorage.removeItem("kitClashCharacterAnimation:sniper");
            orientationSelect.value = "left";
          } else if (currentCharacter === "bomber") {
            localStorage.removeItem("kitClashCharacterAnimation:bomber");
            orientationSelect.value = "left";
          } else if (currentCharacter === "swordsman") {
            localStorage.removeItem("kitClashCharacterAnimation:swordsman");
            orientationSelect.value = "left";
          } else if (currentCharacter === "ninja") {
            localStorage.removeItem("kitClashCharacterAnimation:ninja");
            orientationSelect.value = "left";
          } else if (currentCharacter === "flamethrower") {
            localStorage.removeItem("kitClashCharacterAnimation:flamethrower");
            orientationSelect.value = "left";
            saveMuzzlePoint({ x: canvas.width * 0.261, y: canvas.height * 0.474 }, "flamethrower");
          } else if (currentCharacter === "boomerang") {
            localStorage.removeItem("kitClashCharacterAnimation:boomerang");
            orientationSelect.value = "left";
            saveMuzzlePoint({ x: canvas.width * 0.29, y: canvas.height * 0.39 }, "boomerang");
          } else if (currentCharacter === "ice") {
            localStorage.removeItem("kitClashCharacterAnimation:ice");
            orientationSelect.value = "left";
            saveMuzzlePoint({ x: canvas.width * 0.263, y: canvas.height * 0.35 }, "ice");
          } else if (currentCharacter === "rocket") {
            localStorage.removeItem("kitClashCharacterAnimation:rocket");
            orientationSelect.value = "left";
            saveMuzzlePoint({ x: canvas.width * 0.155, y: canvas.height * 0.405 }, "rocket");
          } else if (currentCharacter === "shield") {
            // Shield Guardian is a permanent layered project costume. Saving the
            // full studio canvas is unnecessary and can exceed localStorage.
            localStorage.removeItem("kitClashCharacterAnimation:shield");
            localStorage.removeItem(storageKey("shield"));
            localStorage.removeItem(`${activeStoragePrefix}shield`);
            orientationSelect.value = "right";
            localStorage.setItem(orientationKey("shield"), "right");
          } else if (currentCharacter === "portal") {
            // Portal Blaster is a permanent project costume; avoid exporting
            // the full canvas into limited browser storage.
            localStorage.removeItem("kitClashCharacterAnimation:portal");
            localStorage.removeItem(storageKey("portal"));
            localStorage.removeItem(`${activeStoragePrefix}portal`);
            orientationSelect.value = "right";
            localStorage.setItem(orientationKey("portal"), "right");
          } else if (currentCharacter === "harpoon") {
            // Harpooner is a permanent project costume; do not store another
            // full-resolution canvas copy in localStorage.
            localStorage.removeItem("kitClashCharacterAnimation:harpoon");
            localStorage.removeItem(storageKey("harpoon"));
            localStorage.removeItem(`${activeStoragePrefix}harpoon`);
            orientationSelect.value = "right";
            localStorage.setItem(orientationKey("harpoon"), "right");
          } else if (currentCharacter === "teleporter") {
            // Teleporter is a permanent project costume. Keep the full sprite out
            // of localStorage so the studio cannot hit the browser storage limit.
            localStorage.removeItem("kitClashCharacterAnimation:teleporter");
            localStorage.removeItem(storageKey("teleporter"));
            localStorage.removeItem(`${activeStoragePrefix}teleporter`);
            orientationSelect.value = "right";
            localStorage.setItem(orientationKey("teleporter"), "right");
          } else if (currentCharacter === "drone") {
            // Drone Controller is a permanent project costume. Avoid copying
            // the large sprite into limited browser storage.
            localStorage.removeItem("kitClashCharacterAnimation:drone");
            localStorage.removeItem(storageKey("drone"));
            localStorage.removeItem(`${activeStoragePrefix}drone`);
            orientationSelect.value = "right";
            localStorage.setItem(orientationKey("drone"), "right");
          } else {
            saveDrawingToGame(currentCharacter, true);
            localStorage.setItem(`${activeStoragePrefix}${currentCharacter}`, "1");
          }
          useGameButton.textContent = "Using in Game ✓";
        } catch (error) {
          useGameButton.textContent = "Could not save";
          console.error("Could not activate costume", error);
        }
        setTimeout(() => { useGameButton.textContent = "Use in Game"; }, 900);
      });

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        button.classList.add("click-confirmed");
        setTimeout(() => button.classList.remove("click-confirmed"), 180);
      });

      function costumeStorageKeys() {
        return Object.keys(localStorage).filter((key) =>
          key.startsWith(drawingStoragePrefix) ||
          key.startsWith(activeStoragePrefix) ||
          key.startsWith(muzzleStoragePrefix) ||
          key.startsWith(orientationStoragePrefix)
        );
      }

      function exportCostumes() {
        saveDrawingToGame();
        const payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          costumes: {},
        };
        costumeStorageKeys().forEach((key) => {
          payload.costumes[key] = localStorage.getItem(key);
        });
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.download = "kit-clash-costumes.json";
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function importCostumes(file) {
        if (!file) return;
        const isPng = file.type === "image/png" || file.name.toLowerCase().endsWith(".png");
        if (isPng) {
          const importCharacter = currentCharacter;
          const importToken = ++drawingLoadToken;
          const image = new Image();
          const objectUrl = URL.createObjectURL(file);
          image.onload = () => {
            URL.revokeObjectURL(objectUrl);
            // Never let a late PNG decode paint onto a different character.
            if (importToken !== drawingLoadToken || importCharacter !== currentCharacter) return;
            const scale = Math.min(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
            const width = image.naturalWidth * scale;
            const height = image.naturalHeight * scale;
            blankCanvas();
            ctx.save();
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
            ctx.restore();
            removeOldPaperPixels();
            history.length = 0;
            resetPaintLayersFromCanvas();
            drawMuzzleOverlay();
            characterCanvasDrafts.set(importCharacter, transparentDataUrl());
            pushHistory();
          };
          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            window.alert("That PNG could not be imported.");
          };
          image.src = objectUrl;
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(reader.result);
            const costumes = payload.costumes || {};
            Object.entries(costumes).forEach(([key, value]) => {
              if (
                typeof value === "string" &&
                (key.startsWith(drawingStoragePrefix) || key.startsWith(activeStoragePrefix) || key.startsWith(muzzleStoragePrefix) || key.startsWith(orientationStoragePrefix))
              ) {
                localStorage.setItem(key, value);
              }
            });
            loadCharacterDrawing(currentCharacter);
          } catch {
            window.alert("That costume file could not be imported.");
          }
        };
        reader.readAsText(file);
      }

      exportCostumesButton.addEventListener("click", exportCostumes);
      importCostumesButton.addEventListener("click", () => importCostumesFile.click());
      importCostumesFile.addEventListener("change", () => {
        importCostumes(importCostumesFile.files[0]);
        importCostumesFile.value = "";
      });

      saveButton.addEventListener("click", () => {
        saveDrawingToGame();
        const link = document.createElement("a");
        link.download = `${characterSelect.options[characterSelect.selectedIndex].textContent.toLowerCase().replaceAll(" ", "-")}.png`;
        link.href = transparentDataUrl();
        link.click();
      });

      loadCharacterDrawing(currentCharacter);
    </script>
  </body>
</html>
